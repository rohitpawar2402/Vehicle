# Mobile Phone Distraction Dataset Configuration for YOLOv8
# Format: Ultralytics YOLO dataset format

path: data/datasets/phone   # dataset root dir
train: images/train         # train images (relative to 'path')
val: images/val             # val images (relative to 'path')
test: images/test           # test images (optional)

# Classes mapping
names:
  0: PHONE_TO_EAR
  1: PHONE_IN_HAND

