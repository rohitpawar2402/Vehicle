[project]
name = "vehicle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7.2",
    "lapx>=0.13.0",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.1",
    "supervision>=0.31.3",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "ultralytics>=8.4.197",
]

[project.scripts]
vehicle = "vehicle:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
